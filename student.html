<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>صفحة الطالب — إنجاز</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/main.css">
<style>

/* ── Dark mode ── */
[data-theme="dark"] .std-hero   { background: linear-gradient(135deg,#1a1d25,#111318); border-color: rgba(255,255,255,.06); }
[data-theme="dark"] .std-avatar { box-shadow: 0 0 0 4px rgba(240,78,35,.35); }
[data-theme="dark"] .std-name   { color: #f1f5f9; }
[data-theme="dark"] .std-email  { color: #64748b; }
[data-theme="dark"] .std-stat-card { background: #1a1d25; border-color: rgba(255,255,255,.07); }
[data-theme="dark"] .std-stat-val  { color: #f1f5f9; }
[data-theme="dark"] .std-stat-lbl  { color: #64748b; }
[data-theme="dark"] .std-section-title { color: #94a3b8; }
[data-theme="dark"] .track-progress-card { background: #1a1d25; border-color: rgba(255,255,255,.07); }
[data-theme="dark"] .tp-title   { color: #f1f5f9; }
[data-theme="dark"] .tp-sub     { color: #64748b; }
[data-theme="dark"] .tp-bar-bg  { background: rgba(255,255,255,.07); }
[data-theme="dark"] .signout-btn { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.1); color: #94a3b8; }
[data-theme="dark"] .signout-btn:hover { background: rgba(201,58,18,.12); border-color: rgba(201,58,18,.3); color: #fca5a5; }

/* ── Hero profile banner ── */
.std-hero {
  background: linear-gradient(135deg, #fff5f2, #ffffff);
  border: 1.5px solid var(--border);
  border-radius: 24px;
  padding: 2rem 1.6rem 1.8rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: .7rem;
  margin-bottom: 1.4rem;
}

.std-avatar {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff6b35, #f04e23);
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; font-weight: 900; color: #fff;
  box-shadow: 0 0 0 4px rgba(240,78,35,.18);
  flex-shrink: 0;
}

.std-name  { font-size: 1.35rem; font-weight: 900; color: var(--dark); line-height: 1.2; }
.std-email { font-size: .82rem; color: var(--gray); }
.std-since { font-size: .78rem; color: var(--gray); }

/* ── Stats row ── */
.std-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 1.4rem;
}
.std-stat-card {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 1rem .8rem;
  text-align: center;
}
.std-stat-val {
  font-size: 1.6rem; font-weight: 900;
  color: var(--red); line-height: 1;
  margin-bottom: 4px;
}
.std-stat-lbl { font-size: .72rem; font-weight: 700; color: var(--gray); }

/* ── Section title ── */
.std-section-title {
  font-size: .74rem; font-weight: 800; letter-spacing: .06em;
  text-transform: uppercase; color: var(--gray);
  margin: 0 0 .8rem;
}

/* ── Track progress cards ── */
.tracks-progress-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.6rem; }

.track-progress-card {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 1.1rem 1.2rem;
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: inherit;
  transition: border-color .15s, box-shadow .15s;
}
.track-progress-card:hover { border-color: rgba(240,78,35,.3); box-shadow: 0 4px 16px rgba(15,23,42,.06); }

.tp-icon {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; flex-shrink: 0;
}
.tp-icon-1 { background: #fff0eb; }
.tp-icon-2 { background: #f0f4ff; }
.tp-icon-3 { background: #f0fff4; }
.tp-icon-4 { background: #fefce8; }

.tp-body { flex: 1; min-width: 0; }
.tp-title { font-size: .92rem; font-weight: 800; color: var(--dark); margin-bottom: 2px; }
.tp-sub   { font-size: .76rem; color: var(--gray); margin-bottom: 6px; }

.tp-bar-bg {
  height: 6px; border-radius: 4px;
  background: #edf0f5;
  overflow: hidden;
}
.tp-bar-fill {
  height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, #ff6b35, #f04e23);
  transition: width .5s ease;
}

.tp-badge {
  font-size: .72rem; font-weight: 800;
  padding: 4px 10px; border-radius: 50px;
  white-space: nowrap; flex-shrink: 0;
}
.tp-badge-done    { background: #f0fdf4; color: #166534; }
.tp-badge-partial { background: #fff7ed; color: #9a3412; }
.tp-badge-new     { background: var(--bg); color: var(--gray); }

/* ── Sign out button ── */
.signout-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 12px;
  background: #fff; border: 1.5px solid var(--border);
  border-radius: 12px; cursor: pointer;
  font-family: 'Tajawal', sans-serif; font-size: .9rem; font-weight: 700;
  color: var(--gray); transition: all .15s;
}
.signout-btn:hover { background: #fff0ed; border-color: #fdd; color: #c93a12; }

.student-actions {
  display: grid;
  gap: 10px;
}

.profile-action-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 12px;
  background: #fff; border: 1.5px solid var(--border);
  border-radius: 8px; cursor: pointer;
  font-family: 'Tajawal', sans-serif; font-size: .9rem; font-weight: 700;
  color: var(--gray); transition: all .15s;
}
.profile-action-btn:hover { background: #f8fafc; border-color: #cbd5e1; color: var(--dark); }

.modal-bg { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(15,23,42,.58); }
.modal-bg.open { display: flex; }
.modal {
  width: min(100%, 420px); background: #fff; border-radius: 8px; padding: 1.4rem;
  box-shadow: 0 22px 60px rgba(15,23,42,.24);
}
.modal-hd { display:flex; align-items:center; justify-content:space-between; gap: 10px; margin-bottom: 1rem; }
.modal-title { font-size: 1rem; font-weight: 900; color: var(--dark); }
.modal-close { border: none; background: transparent; font-size: 1.35rem; line-height: 1; color: var(--gray); cursor: pointer; }
.pass-field { margin-bottom: .8rem; }
.pass-field label { display:block; font-size:.82rem; font-weight:800; color:var(--mid); margin-bottom:5px; }
.pass-field input {
  width:100%; padding:11px 12px; border:1.5px solid var(--border); border-radius:8px;
  font-family:'Tajawal',sans-serif; font-size:.95rem; outline:none; background:#fafbfc;
}
.pass-field input:focus { border-color: var(--red); background:#fff; }
.pass-msg { display:none; font-size:.82rem; padding:9px 12px; border-radius:8px; margin:.8rem 0; }
.pass-msg.ok { display:block; background:#f0fdf4; color:#166534; border:1px solid #bbf7d0; }
.pass-msg.err { display:block; background:#fff0ed; color:#c93a12; border:1px solid #fdd; }
.modal-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:1rem; }
.modal-actions .profile-action-btn { flex:1; min-width:130px; }
.modal-actions .primary { background:var(--red); color:#fff; border-color:var(--red); }

[data-theme="dark"] .profile-action-btn { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.1); color: #94a3b8; }
[data-theme="dark"] .profile-action-btn:hover { background: rgba(255,255,255,.08); color: #f1f5f9; }
[data-theme="dark"] .modal { background:#1a1d25; border:1px solid rgba(255,255,255,.08); }
[data-theme="dark"] .modal-title { color:#f1f5f9; }
[data-theme="dark"] .pass-field label { color:#94a3b8; }
[data-theme="dark"] .pass-field input { background:#111318; color:#f1f5f9; border-color:rgba(255,255,255,.1); }

/* ── Challenge notification cards ── */
.ch-notif-card {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 1rem 1.1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.ch-notif-card.expired { opacity: .6; }
.ch-notif-card.unread  { border-color: rgba(240,78,35,.35); box-shadow: 0 0 0 3px rgba(240,78,35,.08); }
.ch-notif-left { flex: 1; }
.ch-notif-title { font-size: .92rem; font-weight: 800; color: var(--dark); margin-bottom: 4px; }
.ch-notif-code  { font-family: monospace; font-size: 1.1rem; font-weight: 900; color: var(--red); background: #fff5f2; padding: 4px 12px; border-radius: 8px; display: inline-block; letter-spacing: .1em; }
.ch-notif-exp   { font-size: .73rem; color: var(--gray); margin-top: 5px; }
.ch-notif-exp.near { color: #d97706; }
.ch-notif-exp.over { color: #dc2626; }

[data-theme="dark"] .ch-notif-card { background: #1a1d25; border-color: rgba(255,255,255,.08); }
[data-theme="dark"] .ch-notif-title { color: #f1f5f9; }
[data-theme="dark"] .ch-notif-code  { background: rgba(240,78,35,.14); }

</style>
</head>
<body>

<!-- ═══ NAV ════════════════════════════════════ -->
<nav class="site-nav">
  <div class="site-nav-inner">
    <a href="./index.html" class="site-logo">إنجاز</a>
    <div class="site-nav-actions">
      <a href="./tracks.html" class="site-back">المسارات</a>
      <button class="site-theme-btn" id="themeToggle" title="تبديل الوضع">🌙</button>
    </div>
  </div>
</nav>

<!-- ═══ CONTENT ════════════════════════════════ -->
<main class="page-body" style="padding-top: 1.4rem;">

  <!-- Profile Hero -->
  <div class="std-hero" id="std-hero">
    <div class="std-avatar" id="std-avatar">؟</div>
    <div>
      <div class="std-name" id="std-name">...</div>
      <div class="std-email" id="std-email"></div>
      <div class="std-since" id="std-since"></div>
    </div>
  </div>

  <!-- Stats -->
  <div class="std-stats">
    <div class="std-stat-card">
      <div class="std-stat-val" id="stat-tracks">0</div>
      <div class="std-stat-lbl">مسارات مكتملة</div>
    </div>
    <div class="std-stat-card">
      <div class="std-stat-val" id="stat-stages">0</div>
      <div class="std-stat-lbl">مراحل منجزة</div>
    </div>
    <div class="std-stat-card">
      <div class="std-stat-val" id="stat-points">0</div>
      <div class="std-stat-lbl">نقطة مكتسبة</div>
    </div>
  </div>

  <!-- إشعارات التحديات -->
  <div id="challenges-notif-section" style="display:none;margin-bottom:1.4rem;">
    <div class="std-section-title">🔔 تحدياتك</div>
    <div id="challenge-notifs" style="display:flex;flex-direction:column;gap:10px;"></div>
  </div>

  <!-- Track Progress -->
  <div class="std-section-title">تقدّمك في المسارات</div>
  <div class="tracks-progress-list" id="tracks-progress"></div>

  <div class="student-actions">
    <button class="profile-action-btn" onclick="openChangePass()">
      <span>🔑</span> تغيير كلمة المرور
    </button>
    <button class="signout-btn" onclick="Auth.signOut()">
      <span>🚪</span> تسجيل الخروج
    </button>
  </div>

</main>

<div class="modal-bg" id="modal-chgpass">
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-title">تغيير كلمة المرور</div>
      <button class="modal-close" onclick="closeChangePass()">×</button>
    </div>
    <div class="pass-field">
      <label>كلمة المرور الجديدة</label>
      <input type="password" id="new-pass" placeholder="6 أحرف على الأقل">
    </div>
    <div class="pass-field">
      <label>تأكيد كلمة المرور</label>
      <input type="password" id="new-pass-confirm" placeholder="••••••••">
    </div>
    <div class="pass-msg" id="chgpass-msg"></div>
    <div class="modal-actions">
      <button class="profile-action-btn primary" onclick="doChangePassword()">حفظ التغييرات</button>
      <button class="profile-action-btn" onclick="closeChangePass()">إلغاء</button>
    </div>
  </div>
</div>

<script src="./js/config.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/notif-bell.js"></script>
<script>
/* ── Guard: must be logged in ── */
document.addEventListener('DOMContentLoaded', () => {
  const user = Auth.getCurrentUser();
  if (!user) { window.location.href = './auth.html'; return; }
  if (user.role === Auth.roles.TEACHER) { window.location.href = './teacher/dashboard.html'; return; }
  renderProfile(user);
  loadChallengeNotifs(user.id);
});

function loadChallengeNotifs(studentId) {
  CQ_API.getStudentNotifs(studentId).then(notifs => {
    if (!notifs.ok || !notifs.data.length) return;
    const section = document.getElementById('challenges-notif-section');
    const list    = document.getElementById('challenge-notifs');
    section.style.display = '';
    list.innerHTML = '';

    notifs.data.forEach(n => {
      const now     = new Date();
      const expDate = n.expiresAt ? new Date(n.expiresAt) : null;
      const expired = expDate && expDate < now;
      const nearExp = expDate && !expired && (expDate - now) < 48 * 60 * 60 * 1000;

      const expText = expDate
        ? (expired ? 'انتهت الصلاحية' : 'تنتهي: ' + expDate.toLocaleDateString('ar-SA', {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}))
        : '';
      const expClass = expired ? 'over' : (nearExp ? 'near' : '');

      const card = document.createElement('div');
      card.className = 'ch-notif-card' + (expired ? ' expired' : '') + (!n.read ? ' unread' : '');
      card.innerHTML = `
        <div class="ch-notif-left">
          <div class="ch-notif-title">${n.title}</div>
          <div><span class="ch-notif-code">${n.code}</span></div>
          ${expText ? `<div class="ch-notif-exp ${expClass}">${expText}</div>` : ''}
        </div>
        ${expired ? '<span style="font-size:.76rem;color:#dc2626;font-weight:700;">منتهي</span>' : ''}
      `;
      list.appendChild(card);

      if (!n.read) CQ_API.markNotifRead(n.id);
    });
  });
}

const TRACKS = [
  { id: 'track1', href: 'track-1.html', icon: '⚡', iconClass: 'tp-icon-1', title: 'المسار الأول',  sub: 'أساسيات الإلكترونيات',  stages: 4,  points: 40 },
  { id: 'track2', href: 'track-2.html', icon: '🔌', iconClass: 'tp-icon-2', title: 'المسار الثاني', sub: 'الدارات والمكونات',      stages: 4,  points: 60 },
  { id: 'track3', href: 'track-3.html', icon: '🧪', iconClass: 'tp-icon-3', title: 'المسار الثالث', sub: 'المشاريع التطبيقية',    stages: 3,  points: 80 },
  { id: 'track4', href: 'track-4.html', icon: '🏆', iconClass: 'tp-icon-4', title: 'المسار الرابع', sub: 'التحدي النهائي',        stages: 1,  points: 100 },
];

function renderProfile(user) {
  /* Avatar & name */
  document.getElementById('std-avatar').textContent = user.name.charAt(0);
  document.getElementById('std-name').textContent   = user.name;
  document.getElementById('std-email').textContent  = user.email;

  /* Join date from full user record */
  const users = JSON.parse(localStorage.getItem('cq_users') || '[]');
  const full   = users.find(u => u.id === user.id);
  if (full?.joinedAt) {
    const d = new Date(full.joinedAt);
    document.getElementById('std-since').textContent =
      'انضم في ' + d.toLocaleDateString('ar-SA', { year:'numeric', month:'long', day:'numeric' });
  }

  /* Stats */
  const progress = Auth.getAllProgress();
  let completedTracks = 0, completedStages = 0, totalPoints = 0;

  TRACKS.forEach(t => {
    const p = progress[t.id];
    const done = p?.completed ? t.stages : (p?.stagesFinished?.length || 0);
    if (p?.completed) { completedTracks++; totalPoints += t.points; }
    completedStages += done;
  });

  document.getElementById('stat-tracks').textContent = completedTracks;
  document.getElementById('stat-stages').textContent = completedStages;
  document.getElementById('stat-points').textContent = totalPoints;

  /* Track cards */
  const list = document.getElementById('tracks-progress');
  list.innerHTML = TRACKS.map(t => {
    const p = progress[t.id];
    const stagesDone = p?.completed ? t.stages : (p?.stagesFinished?.length || 0);
    const pct = Math.round((stagesDone / t.stages) * 100);

    let badgeClass, badgeTxt;
    if (p?.completed)   { badgeClass = 'tp-badge-done';    badgeTxt = 'مكتمل ✓'; }
    else if (stagesDone){ badgeClass = 'tp-badge-partial';  badgeTxt = `${stagesDone}/${t.stages} مراحل`; }
    else                { badgeClass = 'tp-badge-new';      badgeTxt = 'لم يبدأ'; }

    return `
      <a href="./${t.href}" class="track-progress-card">
        <div class="tp-icon ${t.iconClass}">${t.icon}</div>
        <div class="tp-body">
          <div class="tp-title">${t.title} — ${t.sub}</div>
          <div class="tp-sub">${stagesDone} من ${t.stages} مراحل · ${t.points} نقطة</div>
          <div class="tp-bar-bg"><div class="tp-bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="tp-badge ${badgeClass}">${badgeTxt}</div>
      </a>`;
  }).join('');
}

function sha256(str) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
    .then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){
        return b.toString(16).padStart(2,'0');
      }).join('');
    });
}

function showPassMsg(text, type) {
  const msg = document.getElementById('chgpass-msg');
  msg.textContent = text;
  msg.className = 'pass-msg ' + type;
}

function openChangePass() {
  document.getElementById('new-pass').value = '';
  document.getElementById('new-pass-confirm').value = '';
  document.getElementById('chgpass-msg').className = 'pass-msg';
  document.getElementById('modal-chgpass').classList.add('open');
}

function closeChangePass() {
  document.getElementById('modal-chgpass').classList.remove('open');
}

function doChangePassword() {
  const user = Auth.getCurrentUser();
  const p1 = document.getElementById('new-pass').value;
  const p2 = document.getElementById('new-pass-confirm').value;

  if (!user) { window.location.href = './auth.html'; return; }
  if (!p1 || p1.length < 6) { showPassMsg('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'err'); return; }
  if (p1 !== p2) { showPassMsg('كلمتا المرور غير متطابقتين', 'err'); return; }

  sha256(p1).then(function(hash) {
    CQ_API.changePassword(user.id, hash, 'self').then(function(res) {
      if (res.ok) {
        showPassMsg('تم تغيير كلمة المرور بنجاح ✓', 'ok');
        setTimeout(closeChangePass, 900);
      } else {
        showPassMsg(res.msg || 'تعذر تغيير كلمة المرور', 'err');
      }
    });
  });
}

document.getElementById('modal-chgpass').addEventListener('click', function(e) {
  if (e.target === this) closeChangePass();
});

/* ── Theme toggle ── */
(function () {
  const btn  = document.getElementById('themeToggle');
  const html = document.documentElement;
  const saved = localStorage.getItem('cq_theme') || 'light';
  html.dataset.theme = saved;
  btn.textContent = saved === 'dark' ? '☀️' : '🌙';
  btn.addEventListener('click', () => {
    const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
    html.dataset.theme = next;
    localStorage.setItem('cq_theme', next);
    btn.textContent = next === 'dark' ? '☀️' : '🌙';
  });
})();
</script>
</body>
</html>
