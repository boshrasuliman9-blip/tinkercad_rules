<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Level Map</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #fdcb6e;
            --locked: #2d3436;
            --bg: #0f0c29;
        }

        body {
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        .map-wrapper {
            position: relative;
            width: 350px;
            padding: 50px 20px;
            display: flex;
            flex-direction: column-reverse; /* لعرض المرحلة الأولى في الأسفل */
            gap: 60px;
        }

        /* رسم المسار المنحني خلف المراحل */
        .path-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .level-btn {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary);
            border: 4px solid white;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            text-decoration: none;
        }

        .level-btn:hover {
            transform: scale(1.15);
            background: var(--accent);
            box-shadow: 0 0 25px var(--accent);
        }

        /* توزيع المراحل بشكل متعرج */
        .level-1 { align-self: center; }
        .level-2 { align-self: flex-start; margin-left: 20px; }
        .level-3 { align-self: flex-end; margin-right: 20px; }
        .level-4 { align-self: center; background: var(--locked); border-color: #636e72; cursor: not-allowed; }

        .level-4:hover {
            transform: none;
            background: var(--locked);
            box-shadow: none;
        }

        .level-info {
            position: absolute;
            bottom: -35px;
            width: 120px;
            text-align: center;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 10px;
            pointer-events: none;
        }

        .status-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #00b894;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            border: 2px solid white;
        }

        .locked-icon {
            font-size: 1.2rem;
        }

    </style>
</head>
<body>

    <div class="map-wrapper">
        <!-- SVG لرسم خط يربط بين المراحل -->
        <svg class="path-svg" viewBox="0 0 350 600">
            <path d="M175,550 Q50,450 175,350 T175,150" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6" stroke-dasharray="10,10" />
        </svg>

        <!-- المرحلة 1 -->
        <div class="level-btn level-1">
            1
            <div class="status-badge">✓</div>
            <div class="level-info">الغابة الخضراء</div>
        </div>

        <!-- المرحلة 2 -->
        <div class="level-btn level-2">
            2
            <div class="level-info">الكهف المظلم</div>
        </div>

        <!-- المرحلة 3 -->
        <div class="level-btn level-3">
            3
            <div class="level-info">قلعة الثلج</div>
        </div>

        <!-- المرحلة 4 -->
        <div class="level-btn level-4">
            <span class="locked-icon">🔒</span>
            <div class="level-info">عرين التنين</div>
        </div>
    </div>

    <script>
        // كود بسيط لإضافة تفاعل عند الضغط
        document.querySelectorAll('.level-btn:not(.level-4)').forEach(btn => {
            btn.addEventListener('click', function() {
                const level = this.innerText.trim().split('\n')[0];
                alert('جاري تحميل المرحلة رقم: ' + level);
            });
        });
    </script>
</body>
</html>
