<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>دخول الأدمن - إنجاز</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="./css/auth-admin.css">
</head>
<body class="admin-auth">

<nav class="site-nav">
  <div class="site-nav-inner">
    <a href="./index.html" class="site-logo">إنجاز</a>
    <div class="site-nav-actions">
      <button class="site-theme-btn" id="themeToggle" title="تبديل الوضع">🌙</button>
    </div>
  </div>
</nav>

<main class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="./index.html" class="auth-logo-mark">إنجاز</a>
      <p>تسجيل دخول الأدمن</p>
    </div>

    <form id="form-admin-login" onsubmit="handleAdminLogin(event)" novalidate>
      <div class="auth-field">
        <label for="ad-username">اسم المستخدم</label>
        <input id="ad-username" type="text" placeholder="admin" autocomplete="username" required>
      </div>
      <div class="auth-field">
        <label for="ad-password">كلمة المرور</label>
        <input id="ad-password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" class="auth-submit" id="btn-admin-login">دخول</button>
      <div class="auth-msg" id="msg-admin-login"></div>
    </form>

    <div class="auth-divider">الدخول مخصص للإدارة فقط</div>
  </div>
</main>
<script src="./js/auth-admin.js"></script>
</body>
</html>
