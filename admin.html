<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة — Circuit Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --red:#f04e23; --dark:#0f172a; --mid:#334155;
  --gray:#64748b; --bg:#e8eff5; --white:#fff;
  --border:#dde3ea; --green:#22c55e; --red-err:#ef4444;
}
body { font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--dark); min-height:100vh; }

/* ── Login screen ── */
#login-screen {
  min-height:100vh; display:flex; align-items:center;
  justify-content:center; padding:2rem;
}
.login-card {
  background:var(--white); border:1.5px solid var(--border);
  border-radius:22px; padding:2.4rem; width:100%; max-width:380px;
  text-align:center; box-shadow:0 8px 32px rgba(0,0,0,.08);
}
.login-logo {
  width:52px; height:52px; background:var(--red); border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  font-size:1.6rem; margin:0 auto 1rem;
}
.login-title { font-size:1.3rem; font-weight:800; margin-bottom:.3rem; }
.login-sub { font-size:.84rem; color:var(--gray); margin-bottom:1.6rem; }
.login-input {
  font-family:'Tajawal',sans-serif; font-size:.95rem;
  width:100%; padding:12px 14px; border:1.5px solid var(--border);
  border-radius:10px; text-align:center; letter-spacing:4px;
  outline:none; transition:border-color .15s; margin-bottom:.8rem;
  background:var(--bg);
}
.login-input:focus { border-color:var(--red); background:var(--white); }
.login-btn {
  font-family:'Tajawal',sans-serif; font-size:1rem; font-weight:700;
  width:100%; padding:13px; background:var(--red); color:#fff;
  border:none; border-radius:10px; cursor:pointer; transition:all .15s;
}
.login-btn:hover { background:#c93a12; }
.login-err { font-size:.82rem; color:var(--red-err); margin-top:.5rem; display:none; }

/* ── Admin layout ── */
#admin-screen { display:none; }
.admin-hdr {
  background:var(--white); border-bottom:1.5px solid var(--border);
  padding:12px 20px; display:flex; align-items:center;
  justify-content:space-between; position:sticky; top:0; z-index:50;
}
.admin-brand { display:flex; align-items:center; gap:8px; }
.admin-logo {
  width:32px; height:32px; background:var(--red); border-radius:8px;
  display:flex; align-items:center; justify-content:center; font-size:1rem;
}
.admin-brand-name { font-weight:800; font-size:.95rem; }
.admin-badge {
  font-size:.7rem; font-weight:700; background:#fef9c3; color:#92400e;
  border:1px solid #fbbf24; border-radius:50px; padding:3px 10px;
}
.logout-btn {
  font-family:'Tajawal',sans-serif; font-size:.82rem; font-weight:700;
  color:var(--gray); background:var(--bg); border:1.5px solid var(--border);
  border-radius:8px; padding:6px 14px; cursor:pointer; transition:all .15s;
}
.logout-btn:hover { color:var(--red-err); border-color:var(--red-err); }

.admin-body {
  max-width:860px; margin:0 auto;
  padding:1.6rem 1.2rem 3rem;
  display:flex; flex-direction:column; gap:1.4rem;
}

/* ── Stats row ── */
.stats-row { display:flex; gap:10px; flex-wrap:wrap; }
.stat-box {
  flex:1; min-width:100px; background:var(--white);
  border:1.5px solid var(--border); border-radius:14px; padding:14px 16px;
}
.stat-val { font-size:1.6rem; font-weight:800; color:var(--red); }
.stat-lbl { font-size:.76rem; color:var(--gray); margin-top:2px; }

/* ── Section label ── */
.sec-label {
  font-size:.72rem; font-weight:700; color:var(--gray);
  letter-spacing:1.2px; text-transform:uppercase;
  display:flex; align-items:center; gap:8px;
}
.sec-label::before {
  content:''; width:3px; height:14px; background:var(--red);
  border-radius:2px; display:inline-block;
}

/* ── Submissions list ── */
.sub-list { display:flex; flex-direction:column; gap:10px; }
.sub-card {
  background:var(--white); border:1.5px solid var(--border);
  border-radius:16px; overflow:hidden;
  display:flex; align-items:stretch; gap:0;
}
.sub-img {
  width:110px; flex-shrink:0; object-fit:cover; display:block;
}
.sub-info {
  flex:1; padding:12px 14px; display:flex;
  flex-direction:column; justify-content:center; gap:4px;
}
.sub-name { font-size:.92rem; font-weight:800; color:var(--dark); }
.sub-school { font-size:.78rem; color:var(--gray); }
.sub-challenge {
  display:inline-block; font-size:.68rem; font-weight:700;
  color:var(--red); background:#fff3f0; border-radius:50px;
  padding:2px 9px; margin-top:2px; align-self:flex-start;
}
.sub-actions { display:flex; flex-direction:column; gap:6px; padding:12px; justify-content:center; }
.btn-approve, .btn-delete {
  font-family:'Tajawal',sans-serif; font-size:.78rem; font-weight:700;
  padding:7px 14px; border-radius:8px; border:none;
  cursor:pointer; transition:all .15s; white-space:nowrap;
}
.btn-approve { background:var(--green); color:#fff; }
.btn-approve:hover { background:#16a34a; }
.btn-delete { background:#fef2f2; color:var(--red-err); border:1.5px solid #fecaca; }
.btn-delete:hover { background:var(--red-err); color:#fff; }

/* ── Empty / loading ── */
.empty-msg {
  text-align:center; padding:2.5rem; color:var(--gray);
  font-size:.88rem; background:var(--white); border-radius:16px;
  border:1.5px solid var(--border);
}
.empty-msg .em-icon { font-size:2.2rem; margin-bottom:.5rem; }

/* ── Refresh btn ── */
.refresh-btn {
  font-family:'Tajawal',sans-serif; font-size:.82rem; font-weight:700;
  color:var(--gray); background:var(--white); border:1.5px solid var(--border);
  border-radius:8px; padding:7px 16px; cursor:pointer; transition:all .15s;
}
.refresh-btn:hover { border-color:var(--red); color:var(--red); }

/* ── Toast ── */
#toast {
  position:fixed; bottom:24px; right:50%; transform:translateX(50%);
  background:var(--dark); color:#fff; padding:10px 22px;
  border-radius:10px; font-size:.84rem; font-weight:700;
  opacity:0; transition:opacity .3s; pointer-events:none; z-index:999;
}
#toast.show { opacity:1; }

@media(max-width:480px) {
  .sub-img { width:80px; }
  .sub-actions { flex-direction:row; padding:8px; }
}
</style>
</head>
<body>

<!-- ══ شاشة تسجيل الدخول ══ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">⚡</div>
    <div class="login-title">لوحة الإدارة</div>
    <div class="login-sub">Circuit Quest — للمشرف فقط</div>
    <input type="password" id="pwd-input" class="login-input"
      placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">دخول</button>
    <div class="login-err" id="login-err">كلمة المرور غير صحيحة</div>
  </div>
</div>

<!-- ══ لوحة التحكم ══ -->
<div id="admin-screen">

  <header class="admin-hdr">
    <div class="admin-brand">
      <div class="admin-logo">⚡</div>
      <span class="admin-brand-name">Circuit Quest</span>
      <span class="admin-badge">المشرف</span>
    </div>
    <button class="logout-btn" onclick="doLogout()">تسجيل الخروج</button>
  </header>

  <div class="admin-body">

    <!-- إحصائيات -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-val" id="stat-approved">—</div>
        <div class="stat-lbl">إنجازات منشورة</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="stat-total">—</div>
        <div class="stat-lbl">إجمالي الطلبات</div>
      </div>
    </div>

    <!-- الإنجازات المنشورة -->
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem">
        <div class="sec-label">الإنجازات المنشورة</div>
        <button class="refresh-btn" onclick="loadApproved()">🔄 تحديث</button>
      </div>
      <div class="sub-list" id="approved-list">
        <div class="empty-msg"><div class="em-icon">⏳</div>جاري التحميل...</div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script src="./js/config.js"></script>
<script>
var PASS = 'admin1234'; // ← غيّر كلمة المرور هنا

/* ── تسجيل الدخول ── */
function doLogin() {
  var val = document.getElementById('pwd-input').value;
  var err = document.getElementById('login-err');
  if (val === PASS) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    err.style.display = 'none';
    loadApproved();
  } else {
    err.style.display = 'block';
    document.getElementById('pwd-input').value = '';
  }
}

function doLogout() {
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pwd-input').value = '';
}

/* ── تحميل الإنجازات ── */
function loadApproved() {
  var list = document.getElementById('approved-list');
  list.innerHTML = '<div class="empty-msg"><div class="em-icon">⏳</div>جاري التحميل...</div>';

  fetch(CQ.scriptUrl + '?action=list')
    .then(function (r) { return r.json(); })
    .then(function (items) {
      document.getElementById('stat-approved').textContent = items.length;
      document.getElementById('stat-total').textContent    = items.length;
      renderApproved(items);
    })
    .catch(function () {
      list.innerHTML = '<div class="empty-msg"><div class="em-icon">⚠️</div>تعذّر الاتصال — تحقق من scriptUrl في config.js</div>';
    });
}

function renderApproved(items) {
  var list = document.getElementById('approved-list');
  if (!items.length) {
    list.innerHTML = '<div class="empty-msg"><div class="em-icon">📭</div>لا توجد إنجازات منشورة بعد</div>';
    return;
  }
  list.innerHTML = '';
  items.forEach(function (item) {
    var card = document.createElement('div');
    card.className = 'sub-card';
    card.id = 'card-' + item.id;
    card.innerHTML =
      '<img class="sub-img" src="' + item.imageUrl + '" alt="' + item.name + '">' +
      '<div class="sub-info">' +
        '<div class="sub-name">' + item.name + '</div>' +
        '<div class="sub-school">' + item.school + '</div>' +
        '<span class="sub-challenge">' + item.challenge + '</span>' +
      '</div>' +
      '<div class="sub-actions">' +
        '<button class="btn-delete" onclick="deleteItem(\'' + item.id + '\')">🗑 حذف</button>' +
      '</div>';
    list.appendChild(card);
  });
}

/* ── حذف إنجاز (رفضه مجدداً) ── */
function deleteItem(id) {
  if (!confirm('هل أنت متأكد من حذف هذا الإنجاز؟')) return;
  fetch(CQ.scriptUrl + '?action=reject&id=' + id + '&token=' + 'cq2024')
    .then(function () {
      var card = document.getElementById('card-' + id);
      if (card) card.remove();
      showToast('تم حذف الإنجاز ✓');
      loadApproved();
    })
    .catch(function () { showToast('حدث خطأ!'); });
}

/* ── Toast ── */
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2500);
}
</script>
</body>
</html>
