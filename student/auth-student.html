<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>دخول الطالب - إنجاز</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="./css/auth-student.css">
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a href="../index.html" class="site-logo">إنجاز</a>
    <div class="site-nav-actions">
      <a href="../index.html" class="site-back">الرئيسية</a>
      <button class="site-theme-btn" id="themeToggle" title="تبديل الوضع"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="16" height="16"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    </div>
  </div>
</nav>

<main class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="../index.html" class="auth-logo-mark">إنجاز</a>
      <p>إنجاز - تحدي الإلكترونيات</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('signin')">تسجيل الدخول</button>
      <button class="auth-tab" onclick="switchTab('signup')">إنشاء حساب</button>
    </div>

    <!-- ─── تسجيل الدخول ─── -->
    <div class="auth-panel active" id="panel-signin">
      <form id="form-signin" onsubmit="handleSignIn(event)" novalidate>
        <div class="auth-field">
          <label for="si-email">البريد الإلكتروني</label>
          <input id="si-email" type="email" placeholder="example@mail.com" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="si-password">كلمة المرور</label>
          <input id="si-password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="auth-submit" id="btn-signin">دخول</button>
        <div class="auth-msg" id="msg-signin"></div>
      </form>
      <div class="auth-divider">
        ليس لديك حساب؟
        <button onclick="switchTab('signup')" style="background:none;border:none;color:#ea580c;font-weight:700;cursor:pointer;font-family:inherit;font-size:inherit;">أنشئ حسابًا</button>
      </div>
      <div style="text-align:center;margin-top:.6rem;">
        <button onclick="switchTab('forgot')" style="background:none;border:none;color:var(--gray);font-size:.82rem;cursor:pointer;font-family:inherit;text-decoration:underline;">نسيت كلمة المرور؟</button>
      </div>
    </div>

    <!-- ─── نسيت كلمة المرور ─── -->
    <div class="auth-panel" id="panel-forgot">
      <form id="form-forgot" onsubmit="handleForgot(event)" novalidate>
        <p style="font-size:.88rem;color:var(--gray);margin-bottom:1.2rem;line-height:1.6;">
          أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة تعيين كلمة المرور.
        </p>
        <div class="auth-field">
          <label for="fg-email">البريد الإلكتروني</label>
          <input id="fg-email" type="email" placeholder="example@mail.com" required>
        </div>
        <button type="submit" class="auth-submit" id="btn-forgot">إرسال الطلب</button>
        <div class="auth-msg" id="msg-forgot"></div>
      </form>
      <div class="auth-divider">
        <button onclick="switchTab('signin')" style="background:none;border:none;color:var(--gray);font-size:.82rem;cursor:pointer;font-family:inherit;">← العودة لتسجيل الدخول</button>
      </div>
    </div>

    <!-- ─── إعادة تعيين كلمة المرور ─── -->
    <div class="auth-panel" id="panel-reset">
      <form id="form-reset" onsubmit="handleReset(event)" novalidate>
        <p style="font-size:.88rem;color:var(--gray);margin-bottom:1.2rem;">أدخل كلمة مرور جديدة لحسابك.</p>
        <div class="auth-field">
          <label for="rs-password">كلمة المرور الجديدة</label>
          <input id="rs-password" type="password" placeholder="••••••••" autocomplete="new-password" required>
        </div>
        <div class="auth-field">
          <label for="rs-confirm">تأكيد كلمة المرور</label>
          <input id="rs-confirm" type="password" placeholder="••••••••" autocomplete="new-password" required>
        </div>
        <button type="submit" class="auth-submit" id="btn-reset">تغيير كلمة المرور</button>
        <div class="auth-msg" id="msg-reset"></div>
      </form>
    </div>

    <!-- ─── إنشاء حساب ─── -->
    <div class="auth-panel" id="panel-signup">
      <form id="form-signup" onsubmit="handleSignUp(event)" novalidate>
        <p style="font-size:.88rem;color:var(--gray);margin-bottom:1.2rem;line-height:1.6;">
          سجّل حسابك كطالب وسيتم مراجعة طلبك من قِبل الأدمن.
        </p>
        <div class="auth-field">
          <label for="su-name">الاسم الكامل</label>
          <input id="su-name" type="text" placeholder="أحمد محمد" autocomplete="name" required>
        </div>
        <div class="auth-field">
          <label for="su-email">البريد الإلكتروني</label>
          <input id="su-email" type="email" placeholder="example@mail.com" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="su-phone">رقم الهاتف</label>
          <input id="su-phone" type="tel" placeholder="+9627XXXXXXXX" autocomplete="tel">
        </div>
        <div class="auth-field">
          <label for="su-password">كلمة المرور <span style="font-weight:400;color:var(--gray)">(6 أحرف على الأقل)</span></label>
          <input id="su-password" type="password" placeholder="••••••••" autocomplete="new-password" required>
        </div>
        <button type="submit" class="auth-submit" id="btn-signup">إنشاء الحساب</button>
        <div class="auth-msg" id="msg-signup"></div>
      </form>

      <div class="auth-divider">
        لديك حساب؟
        <button onclick="switchTab('signin')" style="background:none;border:none;color:#ea580c;font-weight:700;cursor:pointer;font-family:inherit;font-size:inherit;">سجّل دخولك</button>
      </div>
    </div>
  </div>
</main>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/auth/auth-student.js"></script>
</body>
</html>
