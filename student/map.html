<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Level Map</title>
    <link rel="stylesheet" href="./css/map.css">
</head>
<body>
<nav class="site-nav">
  <div class="site-nav-inner">
    <a href="../index.html" class="site-logo">إنجاز</a>
    <div class="site-nav-actions">
      <a href="../index.html" class="site-back">الرئيسية</a>
      <button class="site-theme-btn" id="themeToggle" title="تبديل الوضع"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="16" height="16"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    </div>
  </div>
</nav>

    <div class="map-wrapper">
        <!-- SVG لرسم خط يربط بين المراحل -->
        <svg class="path-svg" viewBox="0 0 350 600">
            <path d="M175,550 Q50,450 175,350 T175,150" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6" stroke-dasharray="10,10" />
        </svg>

        <!-- المرحلة 1 -->
        <div class="level-btn level-1">
            1
            <div class="status-badge">✓</div>
            <div class="level-info">الغابة الخضراء</div>
        </div>

        <!-- المرحلة 2 -->
        <div class="level-btn level-2">
            2
            <div class="level-info">الكهف المظلم</div>
        </div>

        <!-- المرحلة 3 -->
        <div class="level-btn level-3">
            3
            <div class="level-info">قلعة الثلج</div>
        </div>

        <!-- المرحلة 4 -->
        <div class="level-btn level-4">
            <span class="locked-icon">🔒</span>
            <div class="level-info">عرين التنين</div>
        </div>
    </div>

<script src="../js/site/map.js"></script>
</body>
</html>
