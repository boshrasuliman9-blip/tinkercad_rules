<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>المسارات — إنجاز</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/main.css">
<link rel="stylesheet" href="../css/tracks/tracks.css">
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a href="../../index.html" class="site-logo">إنجاز</a>
    <div class="site-nav-actions">
      <a href="../../index.html" class="site-back">الرئيسية</a>
      <div id="auth-nav-slot"></div>
      <button class="site-theme-btn" id="themeToggle" title="تبديل الوضع"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="16" height="16"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    </div>
  </div>
</nav>

<main class="page-body">
  <section class="tracks-wrap">
    <div class="hero-band">
      <img src="../../img/tinkercad-account/tinkercad-intro.png" alt="إنجاز">
      <div class="hero-band-overlay">
        <h1 class="hero-band-title">مسارك نحو الإنجاز ⚡</h1>
        <p class="hero-band-sub">4 مسارات تأخذك من الصفر إلى المشروع الحقيقي</p>
      </div>
    </div>

    <div>
      <div class="section-label" style="margin-bottom:1rem">المسارات</div>
      <div class="tracks-grid">

        <a href="./track-1.html" class="track-card">
          <div class="track-num">١</div>
          <div class="track-thumb">
            <img src="../../img/track-covers/track-1-tinkercad.png" alt="تعرف على Tinkercad">
          </div>
          <div class="track-info">
            <div class="track-title">تعرف على Tinkercad</div>
            <div class="track-line">ادخل المسار</div>
          </div>
        </a>

        <a href="./track-2.html" class="track-card">
          <div class="track-num">٢</div>
          <div class="track-thumb">
            <img src="../../img/track-covers/track-2-challenges.png" alt="التحديات">
          </div>
          <div class="track-info">
            <div class="track-title">التحديات</div>
            <div class="track-line">ابدأ التنفيذ</div>
          </div>
        </a>

        <a href="./track-3.html" class="track-card">
          <div class="track-num">٣</div>
          <div class="track-thumb">
            <img src="../../img/track-covers/track-3-submit-work.png" alt="أرسل عملك">
          </div>
          <div class="track-info">
            <div class="track-title">أرسل عملك</div>
            <div class="track-line">ارفع الآن</div>
          </div>
        </a>

        <a href="./track-4.html" class="track-card">
          <div class="track-num">٤</div>
          <div class="track-thumb">
            <img src="../../img/track-covers/track-4-achievements.png" alt="الإنجازات">
          </div>
          <div class="track-info">
            <div class="track-title">الإنجازات</div>
            <div class="track-line">شاهد النتائج</div>
          </div>
        </a>

      </div>
    </div>
  </section>
</main>
<script src="../../js/auth.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/notif-bell.js"></script>
<script src="./js/tracks.js"></script>
</body>
</html>
